version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: 'app_user'
      POSTGRES_PASSWORD: 'app_pass'
      POSTGRES_DB: 'shortener'
    ports:
      - '5432:5432'
    volumes:
      - './init.sql:/docker-entrypoint-initdb.d/init.sql'
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
  app:
    build: .
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis